services:
  postgres:
    image: postgres:18-alpine
    container_name: productcatalog-db
    environment:
      POSTGRES_DB: productcatalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d productcatalog"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: